<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin:0;
            min-height:100vh;
        }
        .main{
            width:100%;
            min-height:100vh;
            color:white;
            background-color:black;
        }

        .hero{
            padding: 2px 20px;
            background-color:rgb(54, 17, 17);
        }
        h1{
            font-size:1.5rem;
        }

        button{
            height : 40px;
            min-width: 60px;
            margin :2px;
        }
        p{
            margin : 1px auto;
        }
        .buttons{
            margin : 10px auto;
            display : flex;
            flex-direction:column;
            /* align-items:start; */
        }

        .cards{
            display : flex;
            overflow-x : auto;
            overflow-y : hidden;
            margin-bottom :40px;
            gap : 4px;
        }

        .card:hover{
            transform:scale(1.5);
            background-color : grey;
        }

        .card{
            min-width : 110px;
            height : 150px;
            border : 1px solid grey;
            margin-right : 10px;
            flex-shrink : 0;
            background-color : white;
        }

        .content{
            min-height :100vh;
            display:flex;
            flex-direction : column;
            justify-content : space-between;
            padding : 20px;
        }

        @media (min-width : 600px){

            .buttons{
                flex-direction : row;
            }
            h1{
                font-size:1.8rem;
            }
            .card{
                min-width : 150px;
            }
        }

        @media (min-width : 1024px){
            h1{
                font-size:2rem;
            }
            .card{
                min-width : 200px;
                flex: 0 0 calc(100% / 6 - 4px); 
                flex-shrink : 0;
            }
        }


    </style>
</head>
<body>
    <div class="main">
        <div class="hero">
            <h1> Midnight Horizon </h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi, aliquid!</p>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            <div class="buttons">
                <button>Play</button>
                <button>More info</button>
            </div>
        </div>
        <div class = 'content'>
            <div class="tn">
                <h3>Trending Now</h3>
                <div class="cards">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </div>
            <div class="cw">
                <h3>Continue Watching</h3>
                <div class="cards">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </div>
            <div class="am">
                <h3>Action Movies</h3>
                <div class="cards">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </div>
        </div> 
    </div>
</body>
</html>
