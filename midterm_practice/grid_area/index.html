<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin : 0;
            height : 100vh;
            width : 100%;
        }
        .main{
            margin:0;
            height : 100vh;
            width : 100%;
            display:flex;
            justify-content : center;
            align-items: center;
        }
        .container{
            height : 50vh;
            width : 40%;
            display : grid;
            grid-template-columns : repeat(4, 1fr);
            grid-template-rows : repeat(4, 1fr);
            grid-template-areas: 
            "box1 box2 box2 box3" 
            "box1 box4 box5 box6" 
            "box1 box7 box8 box6";
            gap :8px;
        }

        .box1{
            box-shadow: 0px 0px 2px 2px black;
        }
        .box2{
            box-shadow: inset 0px 0px 2px 2px black;
        }

        .box3{
            box-shadow: 4px 0px 5px 0px black;
        }

        .box4{
            box-shadow: 4px 4px 0px 0px black;
        }

        .box5{
            box-shadow: -4px -4px 5px 0px black;
        }

        .box6{
            box-shadow: 0px -2px 2px 0px black;
        }

        .box7{
            box-shadow: 0px 2px 2px 0px black;
        }
        .box8{
            box-shadow: 2px 0px 2px 2px black;
        }

    </style>
</head>
<body>
    
    <div class="main">
        <div class="container">
        <div class="box1" style="grid-area:box1; background:linear-gradient(to right, red, blue)" ></div>
        <div class="box2" style="grid-area:box2; background:linear-gradient(to right, red 0%, blue 20%, green 75%)" ></div>
        <div class="box3" style="grid-area:box3; background:linear-gradient(to bottom right, red, blue)" ></div>
        <div class="box4" style="grid-area:box4; background:radial-gradient(circle, red, blue)"></div>
        <div class="box5" style="grid-area:box5; background:radial-gradient(circle, red 45%, blue 75%)" ></div>
        <div class="box6" style="grid-area:box6; background:conic-gradient( red 45deg, blue 75deg)" ></div>
        <div class="box7" style="grid-area:box8; background:conic-gradient( red , blue , green)" ></div>
        <div class="box8" style="grid-area:box7; background-image: conic-gradient(red, white);" ></div>
        </div>
    </div>
</body>
</html>
