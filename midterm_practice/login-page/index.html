<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            min-height:100vh;
            width : 100%;
            margin:0;
        }
        .main{
            min-height : 100vh;
            width :100%;
            display: flex;
            justify-content:center;
            align-items:center;
            background-color: grey;
        }

        .container{
            width : 800px;
            height : 75vh;
            display:flex;
            background-color : white;
            border-radius : 10px;
            overflow:hidden;
        }

        .left{
            width : 35%;
            position : relative;
            background-color : rgb(125, 216, 125);
            display : flex;
            flex-direction : column;
            justify-content : center;
            align-items:center;
        }

        .right{
            width : 65%;
            display:flex;
            flex-direction : column;
            justify-content: center;
            align-items : center;
        }

        .logo{
            position:absolute;
            top :4px;
            left :4px;
        }

        button{
            margin-top:20px;
            height : 40px;
            width : 150px;
            border-radius : 20px;
        }

        p{
            margin: 0px;
        }
        .logos{
            margin-bottom : 20px;
        }

        input{
            margin-top : 10px;
            height : 40px;
            width : 300px;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="left">
                <div class="logo">STAR</div>
                <h1>Welcome back!</h1>
                <p>To keep connected with us please</p>
                <p>login with your personal info</p>
                <button>Sign In</button>
            </div>
            <div class="right">
                <h1>Create Account</h1>
                <div class="logos">O - O - O</div>
                <p>or use use email for registration:</p>
                <input type="text" placeholder="Name"/>
                <input type="email" placeholder="Email"/>
                <input type="password" placeholder="Password"/>
                <button>Sign Up</button>
            </div>
        </div>
    </div>
</body>
</html>
