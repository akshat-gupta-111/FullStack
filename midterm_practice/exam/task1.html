<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media (min-width:1024px){
            .card{
                min-width : 200px;
                flex: 0 0 calc(100% / 6 - 4px); 
                min-height : 150px;
            }
            h1{
                font-size:2em;
            }
        }

        h1{
            font-size:1em;
        }

        body{
            height : 100vh;
            width : 100%;
            margin : 0px;
        }
        .main{
            height : 100vh;
            width : 100%;
            display :flex;
            flex-direction : column;
        }

        .hero{
            padding : 20px;
            min-height : 25vh;
            width : 100%;
            background-color : red;
            color : white;
        }

        .content{
            width : 100%;
            padding : 20px;
            color : white;
            background-color : black;
        }

        .card{
            height : 60px;
            width : 110px;
            background-color : pink;
            flex-shrink:0;
        }

        .card:hover{
            transform : scale(1.5);
            outline: 2px solid black;
        }

        .cards{
            display : flex;
            gap : 8px;
            overflow-x : auto;
        }

        .buttons{
            margin-top:20px;
            width : 200px;
            display : flex;
            justify-content : space-between;
            align-items:center;
        }
        button{
            height: 40px;
            width : 90px;
        }
        p{
            margin : 10px 0px;
        }
        .buttons{
            flex-direction:column;
        }

        @media (min-width:600px){
            .buttons{
            flex-direction:row;
            }
            .card{
                min-width : 150px;
            }
            h1{
                font-size:1.5em;
            }
        }

        
        
    </style>
</head>
<body>
    <div class="main">
        <div class="hero">
            <h1>Midnight Horizon</h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Amet, doloremque.</p>
            <p>Lorem ipsum dolor sit amet consectetur.</p>
            <div class="buttons">
                <button>Play</button>
                <button>More info</button>
            </div>
        </div>
        <div class="content">
            <div class="tn">
                <h3>Trending Now</h3>
                <div class="cards">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </div>
            <div class="cw">
                <h3>Continue Watching</h3>
                <div class="cards">
                    <div class="card"></div>
                </div>
            </div>
            <div class="am">
                <h3>Action Movies</h3>
                <div class="cards">
                    <div class="card"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
